<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAGS Admin Login</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f7f8fb;color:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center}.card{background:#fff;width:min(420px,calc(100% - 36px));padding:28px;border-radius:20px;box-shadow:0 10px 35px rgba(0,0,0,.08)}h1{margin-top:0}label{display:block;font-weight:bold;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:10px}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:10px;background:#111827;color:#fff;font-size:16px;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#f3f4f6;white-space:pre-wrap}.small{font-size:13px;color:#6b7280}</style></head><body><div class="card"><h1>TAGS Admin Login</h1><p class="small">Sign in with the admin account you created in Supabase Authentication.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="login">Login</button><div id="msg" class="msg">Ready.</div></div><script>
const URL=localStorage.getItem("tags_supabase_url")||"";const KEY=localStorage.getItem("tags_supabase_key")||"";const msg=document.getElementById("msg");function show(t){msg.textContent=t;}
async function doLogin(){const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(!URL||!KEY){show("Supabase settings are missing. Open setup.html first and save them.");return;}if(!email||!password){show("Please enter your email and password.");return;}show("Signing in...");try{const r=await fetch(URL.replace(/\/$/,"")+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});const text=await r.text();let data;try{data=JSON.parse(text)}catch(e){data=null}if(!r.ok){show(data?.error_description||data?.msg||data?.message||text||"Login failed.");return;}if(!data?.access_token){show("Login did not return an access token.");return;}sessionStorage.setItem("tags_admin_access_token",data.access_token);sessionStorage.setItem("tags_admin_email",email);location.href="orders.html";}catch(e){show("Connection error: "+e.message);}}
document.getElementById("login").addEventListener("click",doLogin);document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
</script></body></html>
